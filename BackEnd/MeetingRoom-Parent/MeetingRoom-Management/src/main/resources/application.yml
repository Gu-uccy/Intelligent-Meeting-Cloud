server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${room.datasource.driver-class-name}
    url: jdbc:mysql://${room.datasource.host}:${room.datasource.port}/${room.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${room.datasource.username}
    password: ${room.datasource.password}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  cache:
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: ${room.redis.host}
      port: ${room.redis.port}
      database: ${room.redis.database}
      password: ${room.redis.password:}
      connect-timeout: 2s
      timeout: 2s
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
        debug: ${MAIL_DEBUG:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.sky.mapper: debug
    com.sky.service: debug
    com.sky.controller: debug
    org.apache.ibatis.reflection: DEBUG

sky:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET_KEY:admin-dev-secret}
    admin-token-name: ${JWT_ADMIN_TOKEN_NAME:adminToken}
    admin-ttl: ${JWT_ADMIN_TTL:86400000}
    user-secret-key: ${JWT_USER_SECRET_KEY:fydkd}
    user-token-name: ${JWT_USER_TOKEN_NAME:token}
    user-ttl: ${JWT_USER_TTL:864000000000}
  alioss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
