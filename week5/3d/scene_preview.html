<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能会议室 3D 场景初版（统一状态对象联动）</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #info { position: absolute; top: 12px; left: 12px; background: rgba(20,20,30,0.85); color: #eee;
          padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.9; z-index: 10; max-width: 320px; }
  #info h3 { margin: 0 0 6px; font-size: 14px; color: #7cc0ff; }
  #info .ok { color: #7ee787; } #info .bad { color: #ff7b72; }
  #panel { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
           background: rgba(20,20,30,0.85); color: #eee; padding: 8px 14px; border-radius: 8px; font-size: 12px; }
  #panel button { margin: 0 4px; padding: 4px 10px; border: none; border-radius: 4px;
                  background: #2b6cb0; color: #fff; cursor: pointer; }
  #panel button:hover { background: #2c5282; }
  #states { position: absolute; top: 12px; right: 12px; background: rgba(20,20,30,0.85); color: #eee;
            padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.8; z-index: 10; min-width: 200px; }
</style>
</head>
<body>
<div id="info">
  <h3>智能会议室 3D 场景（第6周初版）</h3>
  数据来源：统一状态对象（第3周约定，内嵌 mock 数据，<b>source=mock</b>）<br>
  状态联动：<span class="ok">人员(occupancy)</span> /
  <span class="bad">门(door_status)</span> /
  <span class="ok">灯光(devices.lighting)</span> /
  <span class="bad">温湿度(temperature/humidity)</span> /
  <span class="bad">报警(devices.alarm)</span>
</div>
<div id="states">加载中…</div>
<div id="panel">
  <button onclick="applyState(0)">空闲</button>
  <button onclick="applyState(1)">有人+开门</button>
  <button onclick="applyState(2)">夜间+报警</button>
  <button onclick="applyState(3)">空调运行</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ============ 统一状态对象（内嵌，与 week3/mock/state.json 的 301 同构） ============
const STATE_PRESETS = [
  { // 0 空闲
    room_id: "301", occupancy: false, temperature: 24.6, humidity: 48.0,
    door_status: "closed",
    devices: { lighting: "off", cooling: "off", heating: "off",
               humidifier: "off", dehumidifier: "off", alarm: "off" },
    source: "mock", quality: "normal"
  },
  { // 1 有人+开门
    room_id: "301", occupancy: true, temperature: 26.8, humidity: 45.0,
    door_status: "open",
    devices: { lighting: "on", cooling: "on", heating: "off",
               humidifier: "off", dehumidifier: "off", alarm: "off" },
    source: "mock", quality: "normal"
  },
  { // 2 夜间+报警
    room_id: "301", occupancy: false, temperature: 25.1, humidity: 47.0,
    door_status: "closed",
    devices: { lighting: "off", cooling: "off", heating: "off",
               humidifier: "off", dehumidifier: "off", alarm: "on" },
    source: "mock", quality: "abnormal"
  },
  { // 3 空调运行
    room_id: "301", occupancy: true, temperature: 30.2, humidity: 52.0,
    door_status: "closed",
    devices: { lighting: "on", cooling: "on", heating: "off",
               humidifier: "off", dehumidifier: "off", alarm: "off" },
    source: "mock", quality: "normal"
  }
];

// ============ Three.js 场景 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.6, 6.2);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.update();

// 灯光
const amb = new THREE.AmbientLight(0x404060, 0.55);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(4, 6, 3);
scene.add(sun);
const ceiling = new THREE.PointLight(0xfff2cc, 30, 12);
ceiling.position.set(0, 4.2, 0);
scene.add(ceiling);
const alarmLight = new THREE.PointLight(0xff3b30, 0, 8);
alarmLight.position.set(-1.5, 3.2, -1.5);
scene.add(alarmLight);

// 房间（地板/墙/吊顶）
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.12, 6),
  new THREE.MeshStandardMaterial({ color: 0x8a7f6f, roughness: 0.65 })
);
floor.position.y = -0.06; scene.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xcfd2da, roughness: 0.9 });
const back = new THREE.Mesh(new THREE.BoxGeometry(8, 3.6, 0.12), wallMat);
back.position.set(0, 1.8, -3); scene.add(back);
const left = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.6, 6), wallMat);
left.position.set(-4, 1.8, 0); scene.add(left);
const right = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.6, 6), wallMat);
right.position.set(4, 1.8, 0); scene.add(right);
const ceilingMesh = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 6),
  new THREE.MeshStandardMaterial({ color: 0xe8e8f0, roughness: 0.95 }));
ceilingMesh.position.y = 3.6; scene.add(ceilingMesh);

// 会议桌
const table = new THREE.Mesh(
  new THREE.BoxGeometry(3.6, 0.08, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x9a7b4f, roughness: 0.4 })
);
table.position.set(0, 0.78, -0.4); scene.add(table);
const tableLegs = new THREE.Mesh(
  new THREE.BoxGeometry(3.6, 0.72, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x5a4632 })
);
tableLegs.position.set(0, 0.38, -0.4); scene.add(tableLegs);

// 门模型（轴心在门轴，door_status 联动旋转）
const doorGroup = new THREE.Group();
doorGroup.position.set(3.86, 0, -1.4);
const doorLeaf = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 2.1, 0.85),
  new THREE.MeshStandardMaterial({ color: 0x6a4a2a, roughness: 0.35 })
);
doorLeaf.position.set(0, 1.05, 0.43);
doorGroup.add(doorLeaf);
scene.add(doorGroup);

// 人员模型（occupancy 联动显示/隐藏）
const person = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3f7fd1, roughness: 0.6 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 1.1, 16), bodyMat);
body.position.y = 0.55;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xe8b88a, roughness: 0.5 }));
head.position.y = 1.25;
person.add(body); person.add(head);
person.position.set(-1.4, 0, -0.4);
person.visible = false;
scene.add(person);

// 环境指示牌（温湿度文字）
function makeLabel(text, pos, color) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 96;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#10141c"; ctx.fillRect(0, 0, 512, 96);
  ctx.font = "bold 42px Microsoft YaHei, sans-serif";
  ctx.fillStyle = color; ctx.textAlign = "center";
  ctx.fillText(text, 256, 62);
  const tex = new THREE.CanvasTexture(canvas);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2.8, 0.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  mesh.position.copy(pos);
  scene.add(mesh);
  return mesh;
}
const tempLabel = makeLabel("温度 24.6°C  湿度 48%", new THREE.Vector3(1.4, 3.1, -2.9), "#7ee787");

// ============ 状态联动 ============
const statePanel = document.getElementById("states");
function renderStates(s) {
  statePanel.innerHTML =
    "会议室 <b>" + s.room_id + "</b>  source=" + s.source + " quality=" +
    (s.quality === "normal" ? '<span class="ok">' + s.quality + "</span>"
                            : '<span class="bad">' + s.quality + "</span>") +
    "<br>占用 occupancy：<b>" + (s.occupancy ? '<span class="ok">有人</span>'
                                             : '<span class="bad">无人</span>') + "</b>" +
    "<br>门 door_status：<b>" + (s.door_status === "open"
        ? '<span class="bad">open 开门</span>' : '<span class="ok">closed 关闭</span>') + "</b>" +
    "<br>灯光 devices.lighting：<b>" + s.devices.lighting + "</b>" +
    "<br>制冷 devices.cooling：<b>" + s.devices.cooling + "</b>" +
    "<br>报警 devices.alarm：<b>" + (s.devices.alarm === "on"
        ? '<span class="bad">on（红色报警灯）</span>' : s.devices.alarm) + "</b>";
}

function applyState(idx) {
  const s = STATE_PRESETS[idx];
  // occupancy -> 人员模型
  person.visible = s.occupancy;
  // door_status -> 门旋转（open 90°）
  doorGroup.rotation.y = s.door_status === "open" ? 1.45 : 0;
  // devices.lighting -> 天花板灯光强度
  ceiling.intensity = s.devices.lighting === "on" ? 30 : 6;
  // devices.alarm -> 报警灯
  alarmLight.intensity = s.devices.alarm === "on" ? 40 : 0;
  // 温湿度文字
  const canvas = tempLabel.material.map.image;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#10141c"; ctx.fillRect(0, 0, 512, 96);
  ctx.font = "bold 42px Microsoft YaHei, sans-serif";
  ctx.fillStyle = s.temperature > 26 ? "#ff7b72" : "#7ee787";
  ctx.textAlign = "center";
  ctx.fillText("温度 " + s.temperature.toFixed(1) + "°C  湿度 " + s.humidity.toFixed(1) + "%", 256, 62);
  tempLabel.material.map.needsUpdate = true;
  renderStates(s);
}

// 初始渲染
window.applyState = applyState;  // 暴露给内联按钮（模块作用域函数默认不在 window 上）
applyState(0);
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
